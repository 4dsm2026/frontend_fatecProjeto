name: Auto request team reviewers

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  request-reviewers:
    name: Request responsible lead
    runs-on: ubuntu-latest
    steps:
      - name: Request reviewer based on author team
        uses: actions/github-script@v7
        with:
          # Use o secret com permissão de leitura na organização
          github-token: ${{ secrets.ORG_READ_TOKEN }}
          script: |
            const author = context.payload.pull_request.user.login;
            const prNumber = context.payload.pull_request.number;
            const org = context.repo.owner;

            // Mapeie apenas o "slug" do time no GitHub para o lead correspondente
            const TEAM_LEADS = {
              'novas-funcs-um': 'MDAS-3510',
              'novas-funcs-dois': 'ghzzzz1',
              'qa': 'malusouza2212',
              'docs-devops': 'maysanazario',
              'refatoracao': 'Julianaap02-prog',
              'ux-ui': 'victoriaheloisaa'
            };

            const DEFAULT_LEADS = ['maysanazario', 'Rian-Nito'];
            let leadsToRequest = [];

            // Checa dinamicamente se o autor está no time
            for (const [teamSlug, lead] of Object.entries(TEAM_LEADS)) {
              try {
                const { data: membership } = await github.rest.teams.getMembershipForUserInOrg({
                  org: org,
                  team_slug: teamSlug,
                  username: author
                });

                if (membership && membership.state === 'active') {
                  core.info(`Autor ${author} confirmado no time: ${teamSlug}`);
                  leadsToRequest.push(lead);
                }
              } catch (error) {
                // 404 significa que o usuário não faz parte do time avaliado
                if (error.status !== 404) {
                  core.warning(`Erro ao checar time ${teamSlug}: ${error.message}`);
                }
              }
            }

            // Fallback para leads gerais
            if (leadsToRequest.length === 0) {
              core.info(`Autor ${author} não pertence a nenhum time mapeado. Aplicando leads padrão.`);
              leadsToRequest = [...DEFAULT_LEADS];
            }

            // Remove duplicados e o próprio autor da revisão
            const reviewers = [...new Set(leadsToRequest)]
              .filter(lead => lead.toLowerCase() !== author.toLowerCase());

            if (reviewers.length === 0) {
              core.info(`PR #${prNumber}: Nenhum revisor elegível.`);
              return;
            }

            core.info(`PR #${prNumber}: solicitando revisão de: ${reviewers.join(', ')}`);

            try {
              await github.rest.pulls.requestReviewers({
                owner: org,
                repo: context.repo.repo,
                pull_number: prNumber,
                reviewers: reviewers
              });
              core.info(`Revisores atribuídos com sucesso.`);
            } catch (error) {
              core.warning(`Falha ao atribuir revisores: ${error.message}`);
            }