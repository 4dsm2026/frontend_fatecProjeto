name: Auto request team reviewers

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  request-reviewers:
    name: Request responsible lead
    runs-on: ubuntu-latest
    steps:
      - name: Request reviewer based on author team
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const author = context.payload.pull_request.user.login;
            const prNumber = context.payload.pull_request.number;

            // ==========================================================
            // MEMBROS DE CADA TIME (conforme a tela de Teams da sua Org)
            // ==========================================================
            const TEAMS = {
              'novas-funcs-um': {
                lead: 'MDAS-3510',
                members: ['MDAS-3510'] // Adicione os logins dos membros aqui
              },
              'novas-funcs-dois': {
                lead: 'ghzzzz1',
                members: ['ghzzzz1'] // Adicione os logins dos membros aqui
              },
              'qa': {
                lead: 'malusouza2212',
                members: ['malusouza2212'] // Adicione os logins dos membros aqui
              },
              'docs-devops': {
                lead: 'maysanazario',
                members: ['maysanazario', 'Rian-Nito']
              },
              'refatoracao': {
                lead: 'maysanazario',
                members: ['maysanazario', 'Rian-Nito']
              }
            };

            const DEFAULT_LEADS = ['maysanazario', 'Rian-Nito', 'MDAS-3510', 'ghzzzz1'];
            let leadsToRequest = [];

            // Identifica o time do autor
            for (const [teamName, teamData] of Object.entries(TEAMS)) {
              if (teamData.members.some(m => m.toLowerCase() === author.toLowerCase())) {
                core.info(`Autor ${author} identificado no time: ${teamName}`);
                leadsToRequest.push(teamData.lead);
              }
            }

            // Fallback: se o autor não estiver em nenhuma lista, chama os líderes gerais
            if (leadsToRequest.length === 0) {
              core.info(`Autor ${author} não listado em times específicos. Aplicando líderes padrão.`);
              leadsToRequest = [...DEFAULT_LEADS];
            }

            // Remove duplicados e o próprio autor do PR
            const reviewers = leadsToRequest
              .filter((lead, index, list) => list.indexOf(lead) === index)
              .filter((lead) => lead.toLowerCase() !== author.toLowerCase());

            if (reviewers.length === 0) {
              core.info(`PR #${prNumber}: Nenhum revisor elegível para atribuição.`);
              return;
            }

            core.info(`PR #${prNumber}: solicitando revisão de: ${reviewers.join(', ')}`);

            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                reviewers,
              });
              core.info(`Revisores atribuídos com sucesso.`);
            } catch (error) {
              core.warning(`Falha ao atribuir revisores: ${error.message}`);
            }